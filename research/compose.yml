name: woo-clone-lab
services:
  db:
    image: mariadb:${MARIADB_VERSION:?Set MARIADB_VERSION}
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${LAB_DB_PASSWORD:?Set LAB_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${LAB_DB_ROOT_PASSWORD:?Set LAB_DB_ROOT_PASSWORD}
    volumes:
      - db:/var/lib/mysql
  web:
    image: wordpress:${WORDPRESS_VERSION:?Set WORDPRESS_VERSION}
    ports:
      - "127.0.0.1:${LAB_PORT:-8088}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${LAB_DB_PASSWORD:?Set LAB_DB_PASSWORD}
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - db
volumes:
  db:
  wordpress:
